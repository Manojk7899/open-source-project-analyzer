[package]
name = "open-source-project-analyzer"
version = "0.1.0"
edition = "2024"
default-run = "open-source-project-analyzer"


[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.4", features = ["json"] }
rig-core = "0.40.0"
schemars = "1.0.4"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
url = "2.5.8"
